<!DOCTYPE html>
<html lang="mk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Кабаст Отпад 2026 — Општина Аеродром</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
  :root {
    --primary: #bf4951; --primary-dark: #a3323a;
    --bg: #f1f5fb; --surface: #ffffff; --border: #e2e8f0;
    --text: #1a1a2e; --muted: #64748b; --done: #94a3b8;
    --upcoming: #2d9c5e; --active: #e67e22;
    --admin-color: #bf4951;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; }
  body { background:var(--bg); color:var(--text); font-family:'Inter','IBM Plex Sans',sans-serif; display:flex; flex-direction:column; overflow:hidden; }

  /* ── HEADER ── */
  header { background:var(--surface); border-bottom:1px solid var(--border); padding:1rem 2rem .9rem; flex-shrink:0; position:relative; }
  .header-top { display:flex; align-items:center; gap:1rem; margin-bottom:.65rem; }
  .header-logo { height:48px; width:auto; flex-shrink:0; }
  .header-title-group { line-height:1.2; }
  .header-republic { font-size:.6rem; font-weight:500; color:var(--muted); text-transform:uppercase; letter-spacing:.12em; }
  .header-sep { width:28px; height:2px; background:var(--primary); margin:.25rem 0 .2rem; border:0; }
  .header-municipality { font-size:1rem; font-weight:700; color:var(--text); letter-spacing:-.01em; }
  .campaign-wrap { border-top:1px solid var(--border); padding-top:.65rem; display:flex; align-items:baseline; flex-wrap:wrap; gap:.5rem 1.25rem; }
  .campaign-title { font-family:'Bebas Neue',sans-serif; font-size:clamp(1.8rem,4vw,2.8rem); line-height:.9; color:var(--primary); letter-spacing:.02em; cursor:default; }
  .campaign-meta { display:flex; gap:.8rem 1.5rem; flex-wrap:wrap; font-family:'IBM Plex Mono',monospace; font-size:.6rem; color:var(--muted); margin-left:auto; }
  .campaign-meta strong { color:var(--text); font-weight:600; display:block; font-size:.7rem; }

  /* ── NEXT BANNER ── */
  #next-banner { display:none; background:var(--primary); color:#fff; font-family:'IBM Plex Mono',monospace; font-size:.7rem; padding:.45rem 2rem; text-align:center; flex-shrink:0; cursor:pointer; transition:opacity .18s; }
  #next-banner:hover { opacity:.88; }
  #next-banner strong { font-weight:600; }

  .tabs { display:flex; background:var(--surface); border-bottom:1px solid var(--border); flex-shrink:0; padding:0 2rem; }
  .tab-btn { font-family:'IBM Plex Mono',monospace; font-size:.65rem; letter-spacing:.08em; text-transform:uppercase; padding:.65rem .75rem; background:none; border:none; color:var(--muted); cursor:pointer; border-bottom:2px solid transparent; margin-bottom:-1px; transition:all .15s; }
  .tab-btn:hover { color:var(--text); }
  .tab-btn.active { color:var(--primary); border-bottom-color:var(--primary); }

  .controls { background:var(--surface); padding:.75rem 2rem; border-bottom:1px solid var(--border); display:flex; gap:.65rem; flex-wrap:wrap; align-items:center; flex-shrink:0; }
  .search-wrap { position:relative; flex:1; min-width:160px; }
  .search-wrap input { width:100%; background:var(--bg); border:1px solid var(--border); color:var(--text); font-family:'IBM Plex Mono',monospace; font-size:.72rem; padding:.5rem .7rem .5rem 1.85rem; outline:none; transition:border-color .2s; border-radius:6px; }
  .search-wrap input:focus { border-color:var(--primary); }
  .search-wrap input::placeholder { color:var(--muted); }
  .si { position:absolute; left:.6rem; top:50%; transform:translateY(-50%); color:var(--muted); font-size:.75rem; pointer-events:none; }
  .filter-btns { display:flex; gap:.35rem; flex-wrap:wrap; }
  .filter-btn { font-family:'IBM Plex Mono',monospace; font-size:.58rem; letter-spacing:.05em; padding:.38rem .65rem; background:var(--bg); border:1px solid var(--border); color:var(--muted); cursor:pointer; transition:all .13s; text-transform:uppercase; border-radius:6px; }
  .filter-btn:hover { border-color:var(--primary); color:var(--primary); }
  .filter-btn.active { background:var(--primary); border-color:var(--primary); color:#fff; }

  .panel { display:none; flex:1; overflow:hidden; min-height:0; position:relative; }
  .panel.active { display:flex; flex-direction:column; }

  #map { flex:1; min-height:0; }

  /* ── LEGEND ── */
  #legend {
    position:absolute; bottom:1rem; right:1rem; z-index:1000;
    background:rgba(255,255,255,.92); border:1px solid var(--border);
    border-radius:8px; padding:.35rem .6rem;
    font-family:'IBM Plex Mono',monospace; font-size:.52rem;
    display:flex; flex-direction:column; gap:.22rem; pointer-events:none;
    backdrop-filter:blur(4px); box-shadow:0 2px 8px rgba(0,0,0,.06);
  }
  #legend span { display:flex; align-items:center; gap:.35rem; white-space:nowrap; color:var(--muted); }
  .leg-dot { width:7px; height:7px; border-radius:50%; display:inline-block; flex-shrink:0; }

  /* ── POPUP ── */
  .leaflet-popup-content-wrapper { background:var(--surface) !important; border:1px solid var(--border) !important; border-radius:8px !important; box-shadow:0 4px 16px rgba(0,0,0,.1) !important; color:var(--text) !important; }
  .leaflet-popup-tip { background:var(--surface) !important; border-bottom:1px solid var(--border) !important; border-right:1px solid var(--border) !important; }
  .leaflet-popup-content { margin:10px 12px !important; }
  .p-reon { font-family:'IBM Plex Mono',monospace; font-size:.55rem; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); margin-bottom:.2rem; }
  .p-loc { font-size:.8rem; line-height:1.4; margin-bottom:.3rem; }
  .p-date { font-family:'IBM Plex Mono',monospace; font-size:.65rem; font-weight:600; }
  .p-date.upcoming { color:var(--upcoming); }
  .p-date.active { color:var(--active); }
  .p-date.done { color:var(--done); }
  .popup-actions { display:flex; gap:.3rem; margin-top:.45rem; flex-wrap:wrap; }
  .popup-btn { font-family:'IBM Plex Mono',monospace; font-size:.5rem; letter-spacing:.03em; text-transform:uppercase; padding:.22rem .4rem; background:var(--bg); border:1px solid var(--border); color:var(--muted); cursor:pointer; text-decoration:none; transition:all .12s; display:inline-flex; align-items:center; gap:.2rem; border-radius:4px; }
  .popup-btn:hover { background:var(--primary); border-color:var(--primary); color:#fff; text-decoration:none; }

  #schedule-panel { overflow-y:auto; }
  .timeline { padding:1.25rem 1.5rem; }
  .month-header { font-family:'Bebas Neue',sans-serif; font-size:1.6rem; letter-spacing:.04em; color:#cbd5e1; padding:1rem 0 .35rem; border-top:1px solid var(--border); margin-top:.6rem; position:relative; }
  .month-header:first-child { margin-top:0; border-top:none; }
  .month-count { font-family:'IBM Plex Mono',monospace; font-size:.58rem; color:var(--muted); letter-spacing:.08em; position:absolute; right:0; bottom:.5rem; }

  .entry { display:grid; grid-template-columns:85px 1fr auto; gap:.75rem; padding:.7rem 0; border-bottom:1px solid var(--border); align-items:start; transition:background .1s; cursor:pointer; }
  .entry:hover { background:var(--bg); margin:0 -1.5rem; padding-left:1.5rem; padding-right:1.5rem; border-radius:6px; }
  .entry.hidden { display:none; }
  .entry-date { font-family:'IBM Plex Mono',monospace; font-size:.65rem; color:var(--primary); font-weight:600; padding-top:.1rem; white-space:nowrap; }
  .entry-reon { font-family:'IBM Plex Mono',monospace; font-size:.55rem; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); margin-bottom:.12rem; }
  .entry-location { font-size:.82rem; line-height:1.4; }
  .entry-status { font-family:'IBM Plex Mono',monospace; font-size:.52rem; letter-spacing:.05em; text-transform:uppercase; padding:.15rem .4rem; border:1px solid; white-space:nowrap; align-self:center; border-radius:4px; }
  .status-upcoming { color:var(--upcoming); border-color:var(--upcoming); background:rgba(45,156,94,.06); }
  .status-active { color:var(--active); border-color:var(--active); background:rgba(230,126,34,.08); }
  .status-done { color:var(--done); border-color:var(--done); }
  .status-active .status-dot { animation:pulse 1.5s ease-in-out infinite; }
  @keyframes pulse { 0%,100%{opacity:1}50%{opacity:.55} }

  /* ── ADMIN ── */
  #admin-bar { display:none; background:var(--admin-color); color:#fff; font-family:'IBM Plex Mono',monospace; font-size:.62rem; padding:.4rem 2rem; flex-shrink:0; overflow-x:auto; white-space:nowrap; align-items:center; gap:.55rem; }
  #admin-bar.show { display:flex; }
  .admin-btn { font-family:'IBM Plex Mono',monospace; font-size:.55rem; text-transform:uppercase; letter-spacing:.04em; padding:.25rem .5rem; border:1px solid rgba(255,255,255,.35); background:transparent; color:#fff; cursor:pointer; transition:all .12s; border-radius:4px; }
  .admin-btn:hover { background:#fff; color:var(--admin-color); border-color:#fff; }
  .admin-btn.danger { border-color:rgba(0,0,0,.25); color:rgba(0,0,0,.65); }
  .admin-btn.danger:hover { background:#000; color:#fff; border-color:#000; }
  .admin-save { background:#fff; color:var(--admin-color); font-weight:600; border-color:#fff; }
  body.admin-mode .entry { outline:1px dashed rgba(191,73,81,.25); outline-offset:-1px; cursor:pointer; }
  body.admin-mode .entry:hover { outline-color:var(--admin-color); }
  body.admin-mode .entry.admin-editing { outline:2px solid var(--admin-color); background:var(--bg); border-radius:6px; }
  .admin-edit-field { background:var(--surface); border:1px solid var(--border); color:var(--text); font-family:'IBM Plex Mono',monospace; font-size:.68rem; padding:.18rem .3rem; width:100%; border-radius:4px; }
  .admin-edit-field:focus { border-color:var(--admin-color); outline:none; }
  .admin-add-btn { display:none; font-family:'IBM Plex Mono',monospace; font-size:.6rem; text-transform:uppercase; letter-spacing:.04em; padding:.45rem .9rem; background:transparent; border:1px dashed var(--border); color:var(--muted); cursor:pointer; width:100%; text-align:center; margin:.65rem 0; transition:all .12s; border-radius:6px; }
  .admin-add-btn:hover { border-color:var(--admin-color); color:var(--admin-color); }
  body.admin-mode .admin-add-btn { display:block; }
  .admin-indicator { display:inline-block; width:5px; height:5px; background:#fff; border-radius:50%; animation:pulse 1s ease-in-out infinite; margin-right:.35rem; vertical-align:middle; }
  .admin-toast { position:fixed; bottom:1.5rem; left:50%; transform:translateX(-50%); background:var(--text); color:#fff; font-family:'IBM Plex Mono',monospace; font-size:.65rem; padding:.45rem .9rem; z-index:9999; opacity:0; transition:opacity .25s; pointer-events:none; border-radius:6px; }
  .admin-toast.show { opacity:1; }

  footer { background:var(--surface); border-top:1px solid var(--border); padding:.75rem 2rem; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:.4rem; flex-shrink:0; }
  .footer-note { font-family:'IBM Plex Mono',monospace; font-size:.55rem; color:var(--muted); }
  .count-display { font-family:'IBM Plex Mono',monospace; font-size:.6rem; color:var(--muted); }
  .count-display span { color:var(--primary); font-weight:600; }

  @media(max-width:600px){
    header{padding:.75rem 1rem .7rem}
    .header-top{gap:.7rem}
    .header-logo{height:36px}
    .header-municipality{font-size:.85rem}
    .campaign-title{font-size:clamp(1.4rem,6vw,1.8rem)}
    .campaign-meta{margin-left:0;width:100%;gap:.5rem 1rem}
    .campaign-meta strong{font-size:.65rem}
    #next-banner{padding:.35rem 1rem;font-size:.62rem;text-align:left}
    .tabs{padding:0 1rem}
    .controls{padding:.6rem 1rem}
    #admin-bar{padding:.3rem 1rem;font-size:.55rem}
    .timeline{padding:1rem}
    .entry{grid-template-columns:70px 1fr}
    .entry-status{grid-column:2;justify-self:start;margin-top:.15rem}
    .entry:hover{margin:0 -1rem;padding-left:1rem;padding-right:1rem}
    #legend{bottom:.65rem;right:.5rem;font-size:.48rem;padding:.25rem .5rem}
    footer{padding:.6rem 1rem}
  }
</style>
</head>

</div>

<div id="admin-bar">

  <button class="admin-btn admin-save" onclick="adminSave()">Зачувај</button>
  <button class="admin-btn" onclick="adminExport()">Извези JSON</button>
  <button class="admin-btn" onclick="document.getElementById('admin-import-input').click()">Увези JSON</button>
  <input type="file" id="admin-import-input" accept=".json" style="display:none" onchange="adminImport(event)">
  <button class="admin-btn danger" onclick="adminExit()">Излези</button>
</div>

<div class="panel active" id="map-panel">
  <div id="map"></div>
  <div id="legend">
    <span><span class="leg-dot" style="background:#bf4951"></span> Локации</span>
  </div>
</div>

<div class="panel" id="schedule-panel">
  <div class="timeline" id="timeline"></div>
</div>

<footer>
  <div class="footer-note">Извор: aerodrom.gov.mk · ЈП за Комунални дејности · Tiles &copy; CARTO / OSM</div>
  <div class="count-display">Прикажани: <span id="visible-count">&ndash;</span> локации</div>
</footer>

<div class="admin-toast" id="admin-toast"></div>

// ══════════════════════════════════════════════════
// STATE
// ══════════════════════════════════════════════════

let data = [];
let allMarkers = [];
let map = null;
let cf = 'all', cs = '';
let adminMode = false;
let editingId = null;

const MONTHS = {5:'МАЈ',6:'ЈУНИ',7:'ЈУЛИ'};
const STATUS_LABEL = {upcoming:'Претстојно',active:'Активно',done:'Завршено'};
const STATUS_CLASS = {upcoming:'status-upcoming',active:'status-active',done:'status-done'};

const today = new Date(); today.setHours(0,0,0,0);
function parseDate(s){const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d);}

function getStatus(item){
  const start=parseDate(item.s), end=parseDate(item.e); end.setHours(23,59,59);
  return today>end?'done':today>=start?'active':'upcoming';
}

// ══════════════════════════════════════════════════
// PERSISTENCE
// ══════════════════════════════════════════════════

function loadData(){
  try{
    const saved=localStorage.getItem('kabast_data');
    if(saved){data=JSON.parse(saved); return;}
  }catch(e){}
  data=JSON.parse(JSON.stringify(BASE_DATA));
}
function saveData(){
  localStorage.setItem('kabast_data',JSON.stringify(data));
}

// ══════════════════════════════════════════════════
// RENDER
// ══════════════════════════════════════════════════

function fmtDate(s,e){
  const [sy,sm,sd]=s.split('-'), [ey,em,ed]=e.split('-');
  return sd+'.'+sm+'–'+ed+'.'+em;
}

function renderSchedule(){
  const tl=document.getElementById('timeline');
  const groups={};
  data.forEach(function(item){
    var m=new Date(item.s).getMonth();
    if(!groups[m]) groups[m]=[];
    groups[m].push(item);
  });
  var html='';
  Object.keys(groups).sort().forEach(function(m){
    html+='<div class="month-header">'+(MONTHS[m]||'')+' <span class="month-count"></span></div>';
    groups[m].forEach(function(item){
      var st=getStatus(item); var df=fmtDate(item.s,item.e);
      html+='<div class="entry" data-id="'+item.id+'" data-status="'+st+'">'+
        '<div class="entry-date">'+df+'</div>'+
        '<div class="entry-main">'+
          '<div class="entry-reon">'+esc(item.r)+'</div>'+
          '<div class="entry-location">'+esc(item.l)+'</div>'+
        '</div>'+
        '<div class="entry-status '+STATUS_CLASS[st]+'">'+STATUS_LABEL[st]+'</div>'+
      '</div>';
    });
  });
  tl.innerHTML=html;
  tl.querySelectorAll('.entry').forEach(function(el){
    var id=parseInt(el.dataset.id);
    var item=data.find(function(d){return d.id===id;});
    if(!item) return;
    el.addEventListener('click',function(){
      if(adminMode){ adminEditEntry(id); return; }
      focusMapItem(item);
    });
  });
}

function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

function focusMapItem(item){
  switchTab('map');
  setTimeout(function(){
    map.setView([item.la,item.ln],16,{animate:true});
    allMarkers.forEach(function(m){ if(m._kabastId===item.id) m.openPopup(); });
  },50);
}

// ══════════════════════════════════════════════════
// BANNER
// ══════════════════════════════════════════════════

function updateBanner(){
  var banner=document.getElementById('next-banner');
  var upcoming=data.filter(function(d){return getStatus(d)==='upcoming';}).sort(function(a,b){return a.s.localeCompare(b.s);});
  if(upcoming.length===0){
    var activeItems=data.filter(function(d){return getStatus(d)==='active';});
    if(activeItems.length>0){
      var a=activeItems[0];
      banner.innerHTML='<strong>Активно сега:</strong> '+esc(a.r)+' — '+fmtDate(a.s,a.e);
      banner.style.display='block';
      banner.onclick=function(){focusMapItem(a);};
    }else{banner.style.display='none';}
    return;
  }
  var next=upcoming[0];
  banner.innerHTML='<strong>Следна локација:</strong> '+esc(next.r)+' — '+fmtDate(next.s,next.e);
  banner.style.display='block';
  banner.onclick=function(){focusMapItem(next);};
}

// ══════════════════════════════════════════════════
// MAP
// ══════════════════════════════════════════════════

function initMap(){
  map=L.map('map').setView([41.982,21.470],13);
  L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png',{
    attribution:'&copy; <a href="https://carto.com/">CARTO</a> &copy; <a href="https://openstreetmap.org">OSM</a>',
    subdomains:'abcd', maxZoom:19
  }).addTo(map);
}

function mkIcon(st){
  return L.divIcon({className:'',
    html:'<div style="width:14px;height:14px;background:#bf4951;border:2px solid #fff;border-radius:50%;box-shadow:0 1px 4px rgba(0,0,0,.25);"></div>',
    iconSize:[14,14],iconAnchor:[7,7],popupAnchor:[0,-10]});
}

function renderMarkers(){
  allMarkers.forEach(function(m){map.removeLayer(m);});
  allMarkers=[];
  data.forEach(function(item){
    var st=getStatus(item); var df=fmtDate(item.s,item.e);
    var gmLink='https://www.google.com/maps?q='+item.la+','+item.ln;
    var shareText='Кабаст отпад — '+item.r+': '+item.l+' ('+df+')';
    var opts={icon:mkIcon(st)};
    if(adminMode) opts.draggable=true;
    var m=L.marker([item.la,item.ln],opts).addTo(map);
    if(adminMode){
      m.on('dragend',function(){
        var pos=m.getLatLng();
        item.la=+pos.lat.toFixed(4);
        item.ln=+pos.lng.toFixed(4);
        saveData();
        showToast('Координатите се ажурирани за: '+item.r);
      });
    }
    m.bindPopup(
      '<div class="p-reon">'+esc(item.r)+'</div>'+
      '<div class="p-loc">'+esc(item.l)+'</div>'+
      '<div class="p-date '+st+'">'+df+' · '+STATUS_LABEL[st]+'</div>'+
      '<div class="popup-actions">'+
        '<a class="popup-btn" href="'+gmLink+'" target="_blank" rel="noopener">Google Maps</a>'+
        '<button class="popup-btn" onclick="shareLocation(\''+esc(shareText)+'\',\''+gmLink+'\')">Сподели</button>'+
      '</div>',
    {maxWidth:240});
    m._kabastId=item.id; m._kabastStatus=st;
    m._kabastReon=item.r.toLowerCase(); m._kabastLoc=item.l.toLowerCase();
    allMarkers.push(m);
  });
}

function shareLocation(text,url){
  var full=text+'\n'+url;
  if(navigator.share){ navigator.share({title:'Кабаст Отпад',text:text,url:url}).catch(function(){}); }
  else{ navigator.clipboard.writeText(full).then(function(){ showToast('Копирано во клипборд'); }).catch(function(){}); }
}

// ══════════════════════════════════════════════════
// TABS
// ══════════════════════════════════════════════════

function switchTab(id){
  document.querySelectorAll('.tab-btn').forEach(function(b){b.classList.toggle('active',b.dataset.tab===id);});
  document.querySelectorAll('.panel').forEach(function(p){p.classList.toggle('active',p.id===id+'-panel');});
  if(id==='map') setTimeout(function(){map.invalidateSize();},10);
}
document.querySelectorAll('.tab-btn').forEach(function(b){b.addEventListener('click',function(){switchTab(b.dataset.tab);});});

// ══════════════════════════════════════════════════
// FILTER
// ══════════════════════════════════════════════════

function applyFilters(){
  var entries=document.querySelectorAll('.entry');
  entries.forEach(function(el){
    var mf=cf==='all'||el.dataset.status===cf;
    var reon=(el.querySelector('.entry-reon')?.textContent||'').toLowerCase();
    var loc=(el.querySelector('.entry-location')?.textContent||'').toLowerCase();
    var ms=!cs||reon.includes(cs)||loc.includes(cs);
    el.classList.toggle('hidden',!(mf&&ms));
  });
  allMarkers.forEach(function(m){
    var mf=cf==='all'||m._kabastStatus===cf;
    var ms=!cs||m._kabastReon.includes(cs)||m._kabastLoc.includes(cs);
    if(mf&&ms){if(!map.hasLayer(m))map.addLayer(m);}else{if(map.hasLayer(m))map.removeLayer(m);}
  });
  document.querySelectorAll('.month-header').forEach(function(h){
    var c=0,el=h.nextElementSibling;
    while(el&&!el.classList.contains('month-header')){if(el.classList.contains('entry')&&!el.classList.contains('hidden'))c++;el=el.nextElementSibling;}
    h.querySelector('.month-count').textContent=c?c+' лок.':'';
    h.style.display=c?'':'none';
  });
  document.getElementById('visible-count').textContent=document.querySelectorAll('.entry:not(.hidden)').length;
}

document.querySelectorAll('.filter-btn').forEach(function(b){
  b.addEventListener('click',function(){
    document.querySelectorAll('.filter-btn').forEach(function(x){x.classList.remove('active');});
    b.classList.add('active'); cf=b.dataset.filter; applyFilters();
  });
});
document.getElementById('search').addEventListener('input',function(e){cs=e.target.value.toLowerCase().trim();applyFilters();});

// ══════════════════════════════════════════════════
// ADMIN MODE
// ══════════════════════════════════════════════════

var adminClicks=0, adminTimer=null;
document.getElementById('admin-toggle').addEventListener('click',function(){
  adminClicks++;
  if(adminTimer) clearTimeout(adminTimer);
  adminTimer=setTimeout(function(){adminClicks=0;},800);
  if(adminClicks>=5){ adminClicks=0; adminEnter(); }
});

if(window.location.hash==='#admin') adminEnter();

function adminEnter(){
  if(adminMode) return;
  adminMode=true;
  document.body.classList.add('admin-mode');
  document.getElementById('admin-bar').classList.add('show');
  fullRender();
  showToast('Админ режим — влечете ги пиновите или кликнете на локации за уредување');
}

function adminExit(){
  adminMode=false;
  document.body.classList.remove('admin-mode');
  document.getElementById('admin-bar').classList.remove('show');
  editingId=null;
  fullRender();
}

function adminEditEntry(id){
  if(editingId===id){ editingId=null; fullRender(); return; }
  editingId=id;
  fullRender();
  var item=data.find(function(d){return d.id===id;});
  if(!item) return;
  document.querySelectorAll('.entry').forEach(function(el){
    if(parseInt(el.dataset.id)===id){
      el.classList.add('admin-editing');
      el.querySelector('.entry-date').outerHTML='<input class="admin-edit-field" id="admin-f-s" value="'+item.s+'" style="width:100px" title="Почетен датум (YYYY-MM-DD)"> — <input class="admin-edit-field" id="admin-f-e" value="'+item.e+'" style="width:100px" title="Краен датум (YYYY-MM-DD)">';
      el.querySelector('.entry-reon').outerHTML='<input class="admin-edit-field" id="admin-f-r" value="'+esc(item.r)+'" style="width:100%" title="Реон">';
      el.querySelector('.entry-location').outerHTML='<input class="admin-edit-field" id="admin-f-l" value="'+esc(item.l)+'" style="width:100%" title="Локација">';
      el.querySelector('.entry-status').outerHTML='<button class="admin-btn admin-save" onclick="adminSaveSingle('+id+')" style="font-size:.5rem;padding:.12rem .35rem">Зачувај</button> <button class="admin-btn danger" onclick="adminDelete('+id+')" style="font-size:.5rem;padding:.12rem .35rem">Избриши</button>';
    }
  });
}

function adminSaveSingle(id){
  var s=document.getElementById('admin-f-s')?.value;
  var e=document.getElementById('admin-f-e')?.value;
  var r=document.getElementById('admin-f-r')?.value;
  var l=document.getElementById('admin-f-l')?.value;
  if(!s||!e||!r||!l){ showToast('Сите полиња се задолжителни'); return; }
  var item=data.find(function(d){return d.id===id;});
  if(!item) return;
  item.s=s; item.e=e; item.r=r; item.l=l;
  editingId=null;
  saveData();
  fullRender();
  showToast('Зачувано ✓');
}

function adminDelete(id){
  if(!confirm('Избриши ја оваа локација?')) return;
  data=data.filter(function(d){return d.id!==id;});
  editingId=null;
  saveData();
  fullRender();
  showToast('Избришано');
}

function adminSave(){
  if(editingId!==null){
    var s=document.getElementById('admin-f-s')?.value;
    var e=document.getElementById('admin-f-e')?.value;
    var r=document.getElementById('admin-f-r')?.value;
    var l=document.getElementById('admin-f-l')?.value;
    if(s&&e&&r&&l){
      var item=data.find(function(d){return d.id===editingId;});
      if(item){ item.s=s; item.e=e; item.r=r; item.l=l; }
    }
    editingId=null;
  }
  saveData();
  fullRender();
  showToast('Сите промени се зачувани ✓');
}

function adminExport(){
  var blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  var a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='kabast-data.json';
  a.click();
  URL.revokeObjectURL(a.href);
  showToast('JSON извозот започна');
}

function adminImport(event){
  var file=event.target.files[0];
  if(!file) return;
  var reader=new FileReader();
  reader.onload=function(e){
    try{
      var imported=JSON.parse(e.target.result);
      if(!Array.isArray(imported)) throw new Error('Not an array');
      imported.forEach(function(item,i){if(!item.s||!item.e||!item.r||!item.l) throw new Error('Invalid at '+i);});
      data=imported;
      saveData();
      fullRender();
      showToast('Увезени '+data.length+' локации ✓');
    }catch(err){
      showToast('Грешка при увоз: '+err.message);
    }
  };
  reader.readAsText(file);
  event.target.value='';
}

function adminAddEntry(){
  var maxId=data.reduce(function(m,d){return Math.max(m,d.id);},-1);
  var newId=maxId+1;
  var refMonth=5;
  if(data.length>0){ var last=data[data.length-1]; refMonth=new Date(last.s).getMonth(); }
  var year='2026';
  var mm=String(refMonth+1).padStart(2,'0');
  data.push({id:newId,s:year+'-'+mm+'-01',e:year+'-'+mm+'-02',r:'Нов реон',l:'Нова локација',la:41.982,ln:21.470});
  saveData();
  fullRender();
  setTimeout(function(){adminEditEntry(newId);},50);
  showToast('Нова локација додадена — уредете ги полињата');
}

function showToast(msg){
  var t=document.getElementById('admin-toast');
  t.textContent=msg; t.classList.add('show');
  setTimeout(function(){t.classList.remove('show');},2500);
}

// ══════════════════════════════════════════════════
// FULL RENDER & INIT
// ══════════════════════════════════════════════════

function fullRender(){
  renderSchedule();
  renderMarkers();
  updateBanner();
  applyFilters();
}

loadData();
initMap();
fullRender();

var tl=document.getElementById('timeline');
var addBtn=document.createElement('button');
addBtn.className='admin-add-btn';
addBtn.textContent='+ Додади локација';
addBtn.addEventListener('click',adminAddEntry);
tl.parentElement.insertBefore(addBtn,tl.nextSibling);

</script>
