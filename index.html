<html lang="mk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Кабаст Отпад 2026 — Општина Аеродром</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
  :root {
    --bg: #0f0f0f; --surface: #1a1a1a; --border: #2e2e2e;
    --accent: #e8ff3b; --accent2: #ff6b2b; --text: #e8e8e8; --muted: #888; --done: #444;
    --admin-color: #ff4466;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; }
  body { background:var(--bg); color:var(--text); font-family:'IBM Plex Sans',sans-serif; display:flex; flex-direction:column; overflow:hidden; }

  header { border-bottom:1px solid var(--border); padding:1.5rem 2rem 1.25rem; flex-shrink:0; position:relative; overflow:hidden; }
  header::before { content:''; position:absolute; top:-60px; right:-60px; width:240px; height:240px; background:radial-gradient(circle,rgba(232,255,59,.1) 0%,transparent 70%); pointer-events:none; }
  .header-label { font-family:'IBM Plex Mono',monospace; font-size:.62rem; letter-spacing:.2em; color:var(--accent); text-transform:uppercase; margin-bottom:.4rem; }
  h1 { font-family:'Bebas Neue',sans-serif; font-size:clamp(2.2rem,5vw,3.8rem); line-height:.9; cursor:default; }
  h1 span { color:var(--accent); }
  .header-meta { margin-top:.9rem; display:flex; gap:1.75rem; flex-wrap:wrap; }
  .meta-item { font-family:'IBM Plex Mono',monospace; font-size:.68rem; color:var(--muted); }
  .meta-item strong { color:var(--text); display:block; font-size:.78rem; }

  /* ── NEXT UPCOMING BANNER ── */
  #next-banner { display:none; background:var(--accent); color:#000; font-family:'IBM Plex Mono',monospace; font-size:.72rem; padding:.5rem 2rem; text-align:center; flex-shrink:0; cursor:pointer; transition:opacity .2s; letter-spacing:.03em; }
  #next-banner:hover { opacity:.85; }
  #next-banner strong { font-weight:600; }

  .tabs { display:flex; border-bottom:1px solid var(--border); flex-shrink:0; }
  .tab-btn { font-family:'IBM Plex Mono',monospace; font-size:.72rem; letter-spacing:.08em; text-transform:uppercase; padding:.8rem 1.5rem; background:none; border:none; color:var(--muted); cursor:pointer; border-bottom:2px solid transparent; margin-bottom:-1px; transition:all .15s; }
  .tab-btn:hover { color:var(--text); }
  .tab-btn.active { color:var(--accent); border-bottom-color:var(--accent); }

  .controls { padding:.85rem 2rem; border-bottom:1px solid var(--border); display:flex; gap:.75rem; flex-wrap:wrap; align-items:center; flex-shrink:0; }
  .search-wrap { position:relative; flex:1; min-width:160px; }
  .search-wrap input { width:100%; background:var(--surface); border:1px solid var(--border); color:var(--text); font-family:'IBM Plex Mono',monospace; font-size:.78rem; padding:.55rem .75rem .55rem 2rem; outline:none; transition:border-color .2s; }
  .search-wrap input:focus { border-color:var(--accent); }
  .search-wrap input::placeholder { color:var(--muted); }
  .si { position:absolute; left:.7rem; top:50%; transform:translateY(-50%); color:var(--muted); font-size:.8rem; }
  .filter-btns { display:flex; gap:.4rem; flex-wrap:wrap; }
  .filter-btn { font-family:'IBM Plex Mono',monospace; font-size:.65rem; letter-spacing:.05em; padding:.45rem .8rem; background:var(--surface); border:1px solid var(--border); color:var(--muted); cursor:pointer; transition:all .15s; text-transform:uppercase; }
  .filter-btn:hover, .filter-btn.active { background:var(--accent); border-color:var(--accent); color:#000; }

  .panel { display:none; flex:1; overflow:hidden; min-height:0; position:relative; }
  .panel.active { display:flex; flex-direction:column; }

  #map { flex:1; min-height:0; }

  /* ── LEGEND ── */
  #legend {
    position:absolute; bottom:1.25rem; right:1rem; z-index:1000;
    background:rgba(15,15,15,.88); border:1px solid var(--border);
    padding:.45rem .65rem; font-family:'IBM Plex Mono',monospace; font-size:.55rem;
    display:flex; flex-direction:column; gap:.25rem; pointer-events:none;
    backdrop-filter:blur(4px);
  }
  #legend span { display:flex; align-items:center; gap:.4rem; white-space:nowrap; }
  .leg-dot { width:8px; height:8px; border-radius:50%; display:inline-block; flex-shrink:0; }

  /* ── POPUP ── */
  .leaflet-popup-content-wrapper { background:#1e1e1e !important; border:1px solid #333 !important; border-radius:0 !important; box-shadow:0 4px 20px rgba(0,0,0,.7) !important; color:var(--text) !important; }
  .leaflet-popup-tip { background:#1e1e1e !important; }
  .leaflet-popup-content { margin:10px 12px !important; }
  .p-reon { font-family:'IBM Plex Mono',monospace; font-size:.58rem; letter-spacing:.1em; text-transform:uppercase; color:#666; margin-bottom:.25rem; }
  .p-loc { font-size:.82rem; line-height:1.4; margin-bottom:.35rem; }
  .p-date { font-family:'IBM Plex Mono',monospace; font-size:.7rem; font-weight:600; }
  .p-date.upcoming { color:var(--accent); }
  .p-date.active { color:var(--accent2); }
  .p-date.done { color:#555; }
  .popup-actions { display:flex; gap:.35rem; margin-top:.5rem; flex-wrap:wrap; }
  .popup-btn { font-family:'IBM Plex Mono',monospace; font-size:.55rem; letter-spacing:.04em; text-transform:uppercase; padding:.25rem .45rem; background:var(--surface); border:1px solid var(--border); color:var(--muted); cursor:pointer; text-decoration:none; transition:all .12s; display:inline-flex; align-items:center; gap:.25rem; }
  .popup-btn:hover { background:var(--accent); border-color:var(--accent); color:#000; text-decoration:none; }

  #schedule-panel { overflow-y:auto; }
  .timeline { padding:1.25rem 2rem; }
  .month-header { font-family:'Bebas Neue',sans-serif; font-size:1.8rem; letter-spacing:.05em; color:var(--border); padding:1.25rem 0 .5rem; border-top:1px solid var(--border); margin-top:.75rem; position:relative; }
  .month-header:first-child { margin-top:0; border-top:none; }
  .month-count { font-family:'IBM Plex Mono',monospace; font-size:.62rem; color:var(--muted); letter-spacing:.1em; position:absolute; right:0; bottom:.65rem; }

  .entry { display:grid; grid-template-columns:85px 1fr auto; gap:.85rem; padding:.8rem 0; border-bottom:1px solid var(--border); align-items:start; transition:background .12s; cursor:pointer; }
  .entry:hover { background:var(--surface); margin:0 -2rem; padding-left:2rem; padding-right:2rem; }
  .entry.hidden { display:none; }
  .entry-date { font-family:'IBM Plex Mono',monospace; font-size:.68rem; color:var(--accent); font-weight:600; padding-top:.1rem; white-space:nowrap; }
  .entry-reon { font-family:'IBM Plex Mono',monospace; font-size:.58rem; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); margin-bottom:.15rem; }
  .entry-location { font-size:.85rem; line-height:1.4; }
  .entry-status { font-family:'IBM Plex Mono',monospace; font-size:.56rem; letter-spacing:.06em; text-transform:uppercase; padding:.2rem .45rem; border:1px solid; white-space:nowrap; align-self:center; }
  .status-upcoming { color:var(--accent); border-color:var(--accent); background:rgba(232,255,59,.05); }
  .status-active { color:#000; border-color:var(--accent2); background:var(--accent2); animation:pulse 1.5s ease-in-out infinite; }
  .status-done { color:var(--done); border-color:var(--done); }
  @keyframes pulse { 0%,100%{opacity:1}50%{opacity:.65} }

  /* ── ADMIN ── */
  #admin-bar { display:none; background:var(--admin-color); color:#fff; font-family:'IBM Plex Mono',monospace; font-size:.65rem; padding:.45rem 2rem; flex-shrink:0; overflow-x:auto; white-space:nowrap; align-items:center; gap:.6rem; }
  #admin-bar.show { display:flex; }
  .admin-btn { font-family:'IBM Plex Mono',monospace; font-size:.6rem; text-transform:uppercase; letter-spacing:.05em; padding:.3rem .55rem; border:1px solid rgba(255,255,255,.4); background:transparent; color:#fff; cursor:pointer; transition:all .12s; }
  .admin-btn:hover { background:#fff; color:var(--admin-color); border-color:#fff; }
  .admin-btn.danger { border-color:rgba(0,0,0,.3); color:rgba(0,0,0,.7); }
  .admin-btn.danger:hover { background:#000; color:#fff; border-color:#000; }
  .admin-save { background:#fff; color:var(--admin-color); font-weight:600; border-color:#fff; }
  body.admin-mode .entry { outline:1px dashed rgba(255,68,102,.25); outline-offset:-1px; cursor:pointer; }
  body.admin-mode .entry:hover { outline-color:var(--admin-color); }
  body.admin-mode .entry.admin-editing { outline:2px solid var(--admin-color); background:var(--surface); }
  .admin-edit-field { background:transparent; border:1px solid var(--border); color:var(--text); font-family:'IBM Plex Mono',monospace; font-size:.72rem; padding:.2rem .35rem; width:100%; }
  .admin-edit-field:focus { border-color:var(--admin-color); outline:none; }
  .admin-add-btn { display:none; font-family:'IBM Plex Mono',monospace; font-size:.65rem; text-transform:uppercase; letter-spacing:.05em; padding:.5rem 1rem; background:transparent; border:1px dashed var(--border); color:var(--muted); cursor:pointer; width:100%; text-align:center; margin:.75rem 0; transition:all .12s; }
  .admin-add-btn:hover { border-color:var(--admin-color); color:var(--admin-color); }
  body.admin-mode .admin-add-btn { display:block; }
  .admin-delete-entry { font-family:'IBM Plex Mono',monospace; font-size:.5rem; text-transform:uppercase; letter-spacing:.05em; padding:.15rem .3rem; background:transparent; border:1px solid rgba(255,68,102,.3); color:var(--admin-color); cursor:pointer; transition:all .12s; margin-left:.4rem; vertical-align:middle; }
  .admin-delete-entry:hover { background:var(--admin-color); color:#fff; }
  .admin-indicator { display:inline-block; width:6px; height:6px; background:var(--admin-color); border-radius:50%; animation:pulse 1s ease-in-out infinite; margin-right:.4rem; vertical-align:middle; }
  .admin-toast { position:fixed; bottom:1.5rem; left:50%; transform:translateX(-50%); background:var(--accent); color:#000; font-family:'IBM Plex Mono',monospace; font-size:.7rem; padding:.5rem 1rem; z-index:9999; opacity:0; transition:opacity .25s; pointer-events:none; }
  .admin-toast.show { opacity:1; }

  footer { border-top:1px solid var(--border); padding:.85rem 2rem; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:.5rem; flex-shrink:0; }
  .footer-note { font-family:'IBM Plex Mono',monospace; font-size:.6rem; color:var(--muted); }
  .count-display { font-family:'IBM Plex Mono',monospace; font-size:.65rem; color:var(--muted); }
  .count-display span { color:var(--accent); font-weight:600; }

  @media(max-width:600px){
    header{padding:1.1rem 1rem .9rem}
    #next-banner{padding:.4rem 1rem;font-size:.65rem;text-align:left}
    .controls{padding:.7rem 1rem}
    #admin-bar{padding:.35rem 1rem;font-size:.6rem}
    .timeline{padding:1rem}
    .entry{grid-template-columns:72px 1fr}
    .entry-status{grid-column:2;justify-self:start;margin-top:.2rem}
    .entry:hover{margin:0 -1rem;padding-left:1rem;padding-right:1rem}
    #legend{bottom:.75rem;right:.5rem;font-size:.5rem;padding:.35rem .5rem}
    footer{padding:.7rem 1rem}
  }
</style>
</head>

</div>

<div id="admin-bar">

</div>

<div class="panel active" id="map-panel">

</div>

<div class="panel" id="schedule-panel">

</div>

<footer>

</footer>

<div class="admin-toast" id="admin-toast"></div>

// ══════════════════════════════════════════════════
// STATE
// ══════════════════════════════════════════════════

let data = [];
let nextId = BASE_DATA.length;
let allMarkers = [];
let map = null;
let cf = 'all', cs = '';
let adminMode = false;
let editingId = null;

const MONTHS = {5:'МАЈ',6:'ЈУНИ',7:'ЈУЛИ'};
const STATUS_LABEL = {upcoming:'Претстојно',active:'● Активно',done:'Завршено'};
const STATUS_CLASS = {upcoming:'status-upcoming',active:'status-active',done:'status-done'};

const today = new Date(); today.setHours(0,0,0,0);
function parseDate(s){const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d);}

function getStatus(item){
  const start=parseDate(item.s), end=parseDate(item.e); end.setHours(23,59,59);
  return today>end?'done':today>=start?'active':'upcoming';
}

// ══════════════════════════════════════════════════
// PERSISTENCE
// ══════════════════════════════════════════════════

function loadData(){
  try{
    const saved=localStorage.getItem('kabast_data');
    if(saved){data=JSON.parse(saved); return;}
  }catch(e){}
  data=JSON.parse(JSON.stringify(BASE_DATA));
}
function saveData(){
  localStorage.setItem('kabast_data',JSON.stringify(data));
}

// ══════════════════════════════════════════════════
// RENDER
// ══════════════════════════════════════════════════

function fmtDate(s,e){
  const [sy,sm,sd]=s.split('-'), [ey,em,ed]=e.split('-');
  return sd+'.'+sm+'–'+ed+'.'+em;
}

function renderSchedule(){
  const tl=document.getElementById('timeline');
  const groups={};
  data.forEach(item=>{
    const m=new Date(item.s).getMonth();
    if(!groups[m]) groups[m]=[];
    groups[m].push(item);
  });
  let html='';
  Object.keys(groups).sort().forEach(m=>{
    html+=`<div class="month-header">${MONTHS[m]||''} <span class="month-count"></span></div>`;
    groups[m].forEach(item=>{
      const st=getStatus(item); const df=fmtDate(item.s,item.e);
      html+=`<div class="entry" data-id="${item.id}" data-status="${st}">
        <div class="entry-date">${df}</div>
        <div class="entry-main">
          <div class="entry-reon">${esc(item.r)}</div>
          <div class="entry-location">${esc(item.l)}</div>
        </div>
        <div class="entry-status ${STATUS_CLASS[st]}">${STATUS_LABEL[st]}</div>
      </div>`;
    });
  });
  tl.innerHTML=html;
  tl.querySelectorAll('.entry').forEach(el=>{
    const id=parseInt(el.dataset.id);
    const item=data.find(d=>d.id===id);
    if(!item) return;
    el.addEventListener('click',()=>{
      if(adminMode){ adminEditEntry(id); return; }
      focusMapItem(item);
    });
  });
}

function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

function focusMapItem(item){
  switchTab('map');
  setTimeout(()=>{
    map.setView([item.la,item.ln],16,{animate:true});
    allMarkers.forEach(m=>{ if(m._kabastId===item.id) m.openPopup(); });
  },50);
}

// ══════════════════════════════════════════════════
// NEXT UPCOMING BANNER
// ══════════════════════════════════════════════════

function updateBanner(){
  const banner=document.getElementById('next-banner');
  const upcoming=data.filter(d=>getStatus(d)==='upcoming').sort((a,b)=>a.s.localeCompare(b.s));
  if(upcoming.length===0){
    const activeItems=data.filter(d=>getStatus(d)==='active');
    if(activeItems.length>0){
      const a=activeItems[0];
      banner.innerHTML='<strong>● Активно сега:</strong> '+esc(a.r)+' — '+fmtDate(a.s,a.e);
      banner.style.display='block';
      banner.onclick=()=>focusMapItem(a);
    }else{ banner.style.display='none'; }
    return;
  }
  const next=upcoming[0];
  banner.innerHTML='<strong>Следна локација:</strong> '+esc(next.r)+' — '+fmtDate(next.s,next.e);
  banner.style.display='block';
  banner.onclick=()=>focusMapItem(next);
}

// ══════════════════════════════════════════════════
// MAP
// ══════════════════════════════════════════════════

function initMap(){
  map=L.map('map').setView([41.982,21.470],13);
  L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',{
    attribution:'&copy; <a href="https://carto.com/">CARTO</a> &copy; <a href="https://openstreetmap.org">OSM</a>',
    subdomains:'abcd', maxZoom:19
  }).addTo(map);
}

function mkIcon(st){
  const c={upcoming:'#e8ff3b',active:'#ff6b2b',done:'#444'}[st]||'#e8ff3b';
  return L.divIcon({className:'',
    html:'<div style="width:11px;height:11px;background:'+c+';border:2px solid #000;border-radius:50%;box-shadow:0 0 0 2px '+c+'55;"></div>',
    iconSize:[11,11],iconAnchor:[5,5],popupAnchor:[0,-8]});
}

function renderMarkers(){
  allMarkers.forEach(m=>map.removeLayer(m));
  allMarkers=[];
  data.forEach(item=>{
    const st=getStatus(item); const df=fmtDate(item.s,item.e);
    const gmLink='https://www.google.com/maps?q='+item.la+','+item.ln;
    const shareText='Кабаст отпад — '+item.r+': '+item.l+' ('+df+')';
    const m=L.marker([item.la,item.ln],{icon:mkIcon(st)}).addTo(map);
    m.bindPopup(
      '<div class="p-reon">'+esc(item.r)+'</div>'+
      '<div class="p-loc">'+esc(item.l)+'</div>'+
      '<div class="p-date '+st+'">'+df+' · '+STATUS_LABEL[st]+'</div>'+
      '<div class="popup-actions">'+
        '<a class="popup-btn" href="'+gmLink+'" target="_blank" rel="noopener">Google Maps</a>'+
        '<button class="popup-btn" onclick="shareLocation(\''+esc(shareText)+'\',\''+gmLink+'\')">Сподели</button>'+
      '</div>',
    {maxWidth:240});
    m._kabastId=item.id; m._kabastStatus=st;
    m._kabastReon=item.r.toLowerCase(); m._kabastLoc=item.l.toLowerCase();
    allMarkers.push(m);
  });
}

function shareLocation(text,url){
  const full=text+'\n'+url;
  if(navigator.share){ navigator.share({title:'Кабаст Отпад',text:text,url:url}).catch(function(){}); }
  else{ navigator.clipboard.writeText(full).then(function(){ showToast('Копирано во клипборд'); }).catch(function(){}); }
}

// ══════════════════════════════════════════════════
// TABS
// ══════════════════════════════════════════════════

function switchTab(id){
  document.querySelectorAll('.tab-btn').forEach(function(b){b.classList.toggle('active',b.dataset.tab===id);});
  document.querySelectorAll('.panel').forEach(function(p){p.classList.toggle('active',p.id===id+'-panel');});
  if(id==='map') setTimeout(function(){map.invalidateSize();},10);
}
document.querySelectorAll('.tab-btn').forEach(function(b){b.addEventListener('click',function(){switchTab(b.dataset.tab);});});

// ══════════════════════════════════════════════════
// FILTER
// ══════════════════════════════════════════════════

function applyFilters(){
  const entries=document.querySelectorAll('.entry');
  entries.forEach(function(el){
    const mf=cf==='all'||el.dataset.status===cf;
    const reon=(el.querySelector('.entry-reon')?.textContent||'').toLowerCase();
    const loc=(el.querySelector('.entry-location')?.textContent||'').toLowerCase();
    const ms=!cs||reon.includes(cs)||loc.includes(cs);
    el.classList.toggle('hidden',!(mf&&ms));
  });
  allMarkers.forEach(function(m){
    const mf=cf==='all'||m._kabastStatus===cf;
    const ms=!cs||m._kabastReon.includes(cs)||m._kabastLoc.includes(cs);
    if(mf&&ms){if(!map.hasLayer(m))map.addLayer(m);}else{if(map.hasLayer(m))map.removeLayer(m);}
  });
  document.querySelectorAll('.month-header').forEach(function(h){
    var c=0,el=h.nextElementSibling;
    while(el&&!el.classList.contains('month-header')){if(el.classList.contains('entry')&&!el.classList.contains('hidden'))c++;el=el.nextElementSibling;}
    h.querySelector('.month-count').textContent=c?c+' лок.':'';
    h.style.display=c?'':'none';
  });
  document.getElementById('visible-count').textContent=document.querySelectorAll('.entry:not(.hidden)').length;
}

document.querySelectorAll('.filter-btn').forEach(function(b){
  b.addEventListener('click',function(){
    document.querySelectorAll('.filter-btn').forEach(function(x){x.classList.remove('active');});
    b.classList.add('active'); cf=b.dataset.filter; applyFilters();
  });
});
document.getElementById('search').addEventListener('input',function(e){cs=e.target.value.toLowerCase().trim();applyFilters();});

// ══════════════════════════════════════════════════
// ADMIN MODE
// ══════════════════════════════════════════════════

var adminClicks=0, adminTimer=null;
document.getElementById('admin-toggle').addEventListener('click',function(){
  adminClicks++;
  if(adminTimer) clearTimeout(adminTimer);
  adminTimer=setTimeout(function(){adminClicks=0;},800);
  if(adminClicks>=5){ adminClicks=0; adminEnter(); }
});

if(window.location.hash==='#admin') adminEnter();

function adminEnter(){
  if(adminMode) return;
  adminMode=true;
  document.body.classList.add('admin-mode');
  document.getElementById('admin-bar').classList.add('show');
  showToast('Админ режим — едитирајте ги локациите со клик');
}

function adminExit(){
  adminMode=false;
  document.body.classList.remove('admin-mode');
  document.getElementById('admin-bar').classList.remove('show');
  editingId=null;
  fullRender();
}

function adminEditEntry(id){
  if(editingId===id){ editingId=null; fullRender(); return; }
  editingId=id;
  fullRender();
  var item=data.find(function(d){return d.id===id;});
  if(!item) return;
  document.querySelectorAll('.entry').forEach(function(el){
    if(parseInt(el.dataset.id)===id){
      el.classList.add('admin-editing');
      var dateHtml='<input class="admin-edit-field" id="admin-f-s" value="'+item.s+'" style="width:100px" title="Почетен датум (YYYY-MM-DD)"> — <input class="admin-edit-field" id="admin-f-e" value="'+item.e+'" style="width:100px" title="Краен датум (YYYY-MM-DD)">';
      el.querySelector('.entry-date').outerHTML=dateHtml;
      el.querySelector('.entry-reon').outerHTML='<input class="admin-edit-field" id="admin-f-r" value="'+esc(item.r)+'" style="width:100%" title="Реон">';
      el.querySelector('.entry-location').outerHTML='<input class="admin-edit-field" id="admin-f-l" value="'+esc(item.l)+'" style="width:100%" title="Локација">';
      el.querySelector('.entry-status').outerHTML='<button class="admin-btn admin-save" onclick="adminSaveSingle('+id+')" style="font-size:.55rem;padding:.15rem .4rem">Зачувај</button> <button class="admin-btn danger" onclick="adminDelete('+id+')" style="font-size:.55rem;padding:.15rem .4rem">Избриши</button>';
    }
  });
}

function adminSaveSingle(id){
  var s=document.getElementById('admin-f-s')?.value;
  var e=document.getElementById('admin-f-e')?.value;
  var r=document.getElementById('admin-f-r')?.value;
  var l=document.getElementById('admin-f-l')?.value;
  if(!s||!e||!r||!l){ showToast('Сите полиња се задолжителни'); return; }
  var item=data.find(function(d){return d.id===id;});
  if(!item) return;
  item.s=s; item.e=e; item.r=r; item.l=l;
  editingId=null;
  saveData();
  fullRender();
  showToast('Зачувано ✓');
}

function adminDelete(id){
  if(!confirm('Избриши ја оваа локација?')) return;
  data=data.filter(function(d){return d.id!==id;});
  editingId=null;
  saveData();
  fullRender();
  showToast('Избришано');
}

function adminSave(){
  if(editingId!==null){
    var s=document.getElementById('admin-f-s')?.value;
    var e=document.getElementById('admin-f-e')?.value;
    var r=document.getElementById('admin-f-r')?.value;
    var l=document.getElementById('admin-f-l')?.value;
    if(s&&e&&r&&l){
      var item=data.find(function(d){return d.id===editingId;});
      if(item){ item.s=s; item.e=e; item.r=r; item.l=l; }
    }
    editingId=null;
  }
  saveData();
  fullRender();
  showToast('Сите промени се зачувани ✓');
}

function adminExport(){
  var blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  var a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='kabast-data.json';
  a.click();
  URL.revokeObjectURL(a.href);
  showToast('JSON извозот започна');
}

function adminImport(event){
  var file=event.target.files[0];
  if(!file) return;
  var reader=new FileReader();
  reader.onload=function(e){
    try{
      var imported=JSON.parse(e.target.result);
      if(!Array.isArray(imported)) throw new Error('Not an array');
      imported.forEach(function(item,i){if(!item.s||!item.e||!item.r||!item.l) throw new Error('Invalid at '+i);});
      data=imported;
      nextId=data.reduce(function(m,d){return Math.max(m,d.id+1);},0);
      saveData();
      fullRender();
      showToast('Увезени '+data.length+' локации ✓');
    }catch(err){
      showToast('Грешка при увоз: '+err.message);
    }
  };
  reader.readAsText(file);
  event.target.value='';
}

function adminAddEntry(){
  var maxId=data.reduce(function(m,d){return Math.max(m,d.id);},-1);
  var newId=maxId+1;
  var refMonth=5;
  if(data.length>0){ var last=data[data.length-1]; refMonth=new Date(last.s).getMonth(); }
  var year='2026';
  var mm=String(refMonth+1).padStart(2,'0');
  data.push({id:newId,s:year+'-'+mm+'-01',e:year+'-'+mm+'-02',r:'Нов реон',l:'Нова локација',la:41.982,ln:21.470});
  saveData();
  fullRender();
  setTimeout(function(){adminEditEntry(newId);},50);
  showToast('Нова локација додадена — уредете ги полињата');
}

function showToast(msg){
  var t=document.getElementById('admin-toast');
  t.textContent=msg; t.classList.add('show');
  setTimeout(function(){t.classList.remove('show');},2500);
}

// ══════════════════════════════════════════════════
// FULL RENDER
// ══════════════════════════════════════════════════

function fullRender(){
  renderSchedule();
  renderMarkers();
  updateBanner();
  applyFilters();
}

// ══════════════════════════════════════════════════
// INIT
// ══════════════════════════════════════════════════

loadData();
initMap();
fullRender();

var tl=document.getElementById('timeline');
var addBtn=document.createElement('button');
addBtn.className='admin-add-btn';
addBtn.textContent='+ Додади локација';
addBtn.addEventListener('click',adminAddEntry);
tl.parentElement.insertBefore(addBtn,tl.nextSibling);

</script>
